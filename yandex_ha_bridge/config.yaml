name: Yandex HA Bridge
version: 0.2.0
slug: yandex_ha_bridge
description: Версия 0.2.0: добавлен интерфейс выбора устройств. В Home Assistant будут публиковаться только выбранные устройства.
url: https://github.com/menfis911/hassio-yandex-bridge
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightbulb
panel_title: Yandex HA Bridge
arch:
  - amd64
  - aarch64
options:
  yandex_oauth_token: ""
  device_id: ""
  poll_interval: 30
  log_level: info
schema:
  yandex_oauth_token: password
  device_id: str?
  poll_interval: int
  log_level: list(debug|info|warning|error)

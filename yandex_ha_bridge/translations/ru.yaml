configuration:
  yandex_oauth_token:
    name: OAuth-токен Яндекса
    description: OAuth-токен для доступа к Яндекс Умному дому. Нужен доступ iot:view. Токен хранится только в локальной конфигурации Home Assistant.
  device_id:
    name: Идентификатор устройства
    description: Необязательный ID устройства Яндекса. Если оставить пустым, аддон автоматически найдёт устройство модели YNDX-00019.
  poll_interval:
    name: Интервал опроса
    description: Интервал между запросами состояния устройства в секундах. Минимум 10 секунд.
  log_level:
    name: Уровень логирования
    description: Уровень подробности журнала аддона.

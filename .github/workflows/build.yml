name: Build Yandex HA Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hassio-yandex-bridge

auto_tag:
  # This job is intentionally separate from the image build so HACS gets a
  # versioned git tag for every published addon/integration version.
  runs-on: ubuntu-latest
  permissions:
    contents: write
  steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Read version
      id: version
      shell: bash
      run: echo "version=$(awk '/^version:/{print $2}' yandex_ha_bridge/config.yaml)" >> "$GITHUB_OUTPUT"
    - name: Create version tag when missing
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -e
        if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
          echo "Tag v${VERSION} already exists"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v${VERSION}" -m "Release v${VERSION}" "${GITHUB_SHA}"
        git push origin "v${VERSION}"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python and JSON
        shell: bash
        run: |
          python -m compileall -q custom_components/yandex_ha_bridge yandex_ha_bridge/app
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("custom_components/yandex_ha_bridge/manifest.json").read_text())
          json.loads(Path("custom_components/yandex_ha_bridge/strings.json").read_text())
          json.loads(Path("hacs.json").read_text())
          print("Yandex HA Bridge integration syntax and JSON validation passed")
          PY

  init:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(awk '/^version:/{print $2}' yandex_ha_bridge/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: [validate, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          arch: ${{ matrix.arch }}
          context: ./yandex_ha_bridge
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: true
          version: ${{ needs.init.outputs.version }}

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

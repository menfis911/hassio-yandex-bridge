name: Build Yandex HA Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yandex-ha-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hassio-yandex-bridge

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python, JSON and integration structure
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/yandex_ha_bridge yandex_ha_bridge/app
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          root = Path("custom_components/yandex_ha_bridge")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          en = json.loads((root / "translations/en.json").read_text(encoding="utf-8"))
          ru = json.loads((root / "translations/ru.json").read_text(encoding="utf-8"))
          light_source = (root / "light.py").read_text(encoding="utf-8")
          select_source = (root / "select.py").read_text(encoding="utf-8")
          init_source = (root / "__init__.py").read_text(encoding="utf-8")
          coordinator_source = (root / "coordinator.py").read_text(encoding="utf-8")
          api_source = (root / "api.py").read_text(encoding="utf-8")
          const_source = (root / "const.py").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          changelog = Path("yandex_ha_bridge/CHANGELOG.md").read_text(encoding="utf-8")
          app_config = Path("yandex_ha_bridge/config.yaml").read_text(encoding="utf-8")
          bridge_source = Path("yandex_ha_bridge/app/bridge.py").read_text(encoding="utf-8")

          # Parse every Python file explicitly. compileall above is retained as a fast baseline.
          for path in [*root.glob("*.py"), *Path("yandex_ha_bridge/app").glob("*.py")]:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          app_version_match = re.search(r"^version:\s*([^\s]+)", app_config, re.MULTILINE)
          bridge_version_match = re.search(r'^VERSION\s*=\s*[\"\']([^\"\']+)', bridge_source, re.MULTILINE)
          api_version_match = re.search(r'^VERSION\s*=\s*[\"\']([^\"\']+)', api_source, re.MULTILINE)
          const_version_match = re.search(r'^VERSION\s*=\s*[\"\']([^\"\']+)', const_source, re.MULTILINE)
          assert app_version_match and bridge_version_match and api_version_match and const_version_match, "Version declarations are incomplete"

          app_version = app_version_match.group(1)
          bridge_version = bridge_version_match.group(1)
          api_version = api_version_match.group(1)
          const_version = const_version_match.group(1)
          version = manifest["version"]

          assert manifest["domain"] == "yandex_ha_bridge"
          assert manifest["name"] == "Yandex HA Bridge"
          assert {app_version, bridge_version, api_version, const_version, version} == {version}, "Version mismatch"
          assert hacs["name"] == "Yandex HA Bridge"
          assert "config" in en and "config" in ru
          assert "options" in en and "options" in ru
          assert (root / "config_flow.py").is_file()
          assert not (root / "strings.json").exists()

          # Light platform contract.
          assert "from homeassistant.components.light import" in light_source
          assert "ATTR_BRIGHTNESS" in light_source
          assert "ATTR_RGB_COLOR" in light_source
          assert "ATTR_COLOR_TEMP_KELVIN" in light_source
          assert "from homeassistant.const import ATTR_BRIGHTNESS" not in light_source
          assert "from homeassistant.helpers.entity import DeviceInfo" in light_source
          assert "self._attr_device_info = DeviceInfo(" in light_source
          assert "identifiers={(DOMAIN, device_id)}" in light_source
          assert "serial_number=device_id" in light_source
          assert "device_registry" not in init_source
          assert "async_get_or_create" not in init_source
          assert "ColorMode" in light_source
          assert "async_turn_on" in light_source
          assert "async_turn_off" in light_source
          assert "temperature_k" in light_source
          assert "color_model" in light_source

          # Select platform contract: presets/scenes must remain covered by CI.
          assert "from homeassistant.components.select import SelectEntity" in select_source
          assert "class YandexLightPresetSelect" in select_source
          assert "async_setup_entry" in select_source
          assert '"Тёплый свет"' in select_source
          assert '"Нейтральный свет"' in select_source
          assert '"Холодный свет"' in select_source
          assert '"Красный"' in select_source
          assert '"Зелёный"' in select_source
          assert '"Синий"' in select_source
          assert '"party": "Вечеринка"' in select_source
          assert '"color_scene"' in select_source
          assert '"instance": "color_scene"' in select_source
          assert '"instance": "temperature_k"' in select_source
          assert '"instance": "hsv"' in select_source
          assert '"instance": "on"' in select_source

          # Platform registration must include both light and select.
          assert "PLATFORMS = [Platform.LIGHT, Platform.SELECT]" in const_source

          # Coordinator/action contract.
          assert "config_entry=entry" in coordinator_source
          assert "except YandexApiError as err:" in coordinator_source
          assert "raise UpdateFailed(str(err)) from err" in coordinator_source
          assert "async def async_action" in coordinator_source
          assert "except YandexApiError:" in coordinator_source
          assert "await self.async_request_refresh()" in coordinator_source

          # Yandex control API contract.
          assert "/v1.0/devices/actions" in api_source
          assert "iot:control" in api_source
          assert "if not actions:" in api_source
          assert "Yandex-HABridge/" in api_source

          # Documentation/version checks. Match the version heading even when it has a date suffix.
          assert re.search(rf"(?:^|[^0-9]){re.escape(version)}(?:[^0-9]|$)", readme), "README does not mention current version"
          assert re.search(rf"^##\s+{re.escape(version)}(?:\s|$)", changelog, re.MULTILINE), "CHANGELOG is missing current version heading"
          assert "iot:control" in readme
          assert "Device Registry" in readme
          assert "Режим" in readme
          assert "Вечеринка" in readme or "party" in readme

          print(f"Yandex HA Bridge {version} validation passed")
          PY

  init:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(awk '/^version:/{print $2}' yandex_ha_bridge/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: [validate, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          arch: ${{ matrix.arch }}
          context: ./yandex_ha_bridge
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: true
          version: ${{ needs.init.outputs.version }}

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

  tag:
    needs: [validate, init, build, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release current version when needed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "${CURRENT_MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "This workflow run is stale; release publication is skipped."
            exit 0
          fi
          VERSION="$(awk '/^version:/{print $2}' yandex_ha_bridge/config.yaml)"
          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
            echo "Tag ${TAG} already exists at ${TAG_SHA}."
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; nothing to publish."
              exit 0
            fi
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Existing tag belongs to the already released version; release creation is skipped because the tag targets an older commit."
              exit 0
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "Yandex HA Bridge ${TAG}" --generate-notes
          fi
